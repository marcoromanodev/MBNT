<script>
function updateChicagoTime() {
    const options = { timeZone:'America/Chicago', hour:'2-digit', minute:'2-digit', year:'numeric', month:'2-digit', day:'2-digit' };
    const currentTime = new Intl.DateTimeFormat('en-US', options).format(new Date()).replace(",", "");
    document.getElementById('current-time').textContent = currentTime + " CHICAGO";
}
setInterval(updateChicagoTime, 1000);
updateChicagoTime();
const logoOverlay = document.querySelector('.logo-overlay');
if (logoOverlay) {
    let pressTimer;
    let moved = false;
    const restoreOverlay = () => { logoOverlay.style.display = "block"; };
    const cancel = () => {
        clearTimeout(pressTimer);
        document.removeEventListener("mousemove", moveHandler);
        document.removeEventListener("touchmove", moveHandler);
        document.removeEventListener("mouseup", cancel);
        document.removeEventListener("touchend", cancel);
        document.removeEventListener("touchcancel", cancel);
        logoOverlay.style.display = "none";
        setTimeout(restoreOverlay, 1000);
    };
    const moveHandler = () => { moved = true; };
    const start = () => {
        moved = false;
        pressTimer = setTimeout(() => { if (!moved) window.location.href = 'index.html'; }, 1000);
        document.addEventListener("mousemove", moveHandler);
        document.addEventListener("touchmove", moveHandler);
        document.addEventListener("mouseup", cancel);
        document.addEventListener("touchend", cancel);
        document.addEventListener("touchcancel", cancel);
    };
    logoOverlay.addEventListener("mousedown", start);
    logoOverlay.addEventListener("touchstart", start);
    const loadFact = () => {
        const today = new Date();
        const month = today.getMonth() + 1;
        const day = today.getDate();
        const dateOptions = { month: 'long', day: 'numeric', year: 'numeric' };
        fetch(`https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/${month}/${day}`)
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('random-msg');
                if (data.events && data.events.length) {
                    const event = data.events[Math.floor(Math.random() * data.events.length)];
                    const link = (event.pages && event.pages[0] && event.pages[0].content_urls && event.pages[0].content_urls.desktop)
                        ? event.pages[0].content_urls.desktop.page
                        : `https://en.wikipedia.org/wiki/${encodeURIComponent(event.title)}`;
                    const eventDate = new Date(event.year, month - 1, day);
                    const dateString = eventDate.toLocaleDateString('en-US', dateOptions);
                    container.innerHTML = `${dateString} ${event.text} <a class="source-link" href="${link}" target="_blank" rel="noopener">source</a>`;
                } else {
                    container.textContent = 'No facts available today.';
                }
            })
            .catch(() => {
                document.getElementById('random-msg').textContent = 'Error fetching fact.';
            });
    };
    loadFact();
}
</script>

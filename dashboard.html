<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Team Private Admin</title><style>
html,body{min-height:100%}body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#000}.dashboard-shell{min-height:100vh;display:flex;flex-direction:column}.site-shell{max-width:1100px;margin:0 auto;padding:12px;flex:1;display:flex;flex-direction:column}.logo-container iframe{width:100%;height:120px;border:0}.time{font-size:12px;text-align:center;margin:6px 0 12px}.panel{border:1px solid #000;padding:12px;margin:10px 0}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}button{background:#000;color:#fff;border:1px solid #000;padding:8px;cursor:pointer}button:hover{border-color:#c00;color:#c00;background:#fff}input,textarea,select{width:100%;border:1px solid #000;padding:7px}h1,h2{margin:4px 0 10px}ul{padding-left:18px}small.err{color:#c00}main{flex:1}.grid-head,.grid-row{display:grid;grid-template-columns:90px 1.2fr .8fr .9fr 1fr;gap:8px;align-items:center}.grid-head{font-weight:700;border-bottom:1px solid #000;padding-bottom:6px}.grid-row{padding:8px 0;border-bottom:1px solid #ddd;font-size:13px}.status-active{color:#090}.status-sold{color:#c00}.status-inactive{color:#666}.edit-panel{border:1px solid #000;padding:10px;margin:4px 0 10px}.product-img{width:80px;height:80px;object-fit:cover;border:1px solid #000}.variant-row{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin-bottom:8px}.footer-links{margin-top:50px;text-align:center}.footer-line{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;padding:6px 0}.footer-line.extra-padding{padding-top:16px}.footer-line.less-padding{padding-bottom:16px}.footer-links a{text-decoration:none;color:#000}
</style></head><body>
<div class="dashboard-shell"><div class="site-shell"><div class="logo-container"><iframe src="https://www.vectary.com/viewer/v1/?model=8b9281ad-097b-4408-88e2-ef824efa63eb&env=studio3&turntable=1"></iframe></div><div id="current-time" class="time"></div>
<section id="auth" class="panel"><form id="loginForm"><h1>Team Private Admin</h1><input id="username" placeholder="Username" required/><input id="password" type="password" placeholder="Password" required/><button>Login</button><small id="authError" class="err"></small></form></section>
<main id="dashboard" hidden>
<div class="panel"><button id="logoutBtn">Logout</button> <select id="filterRange"><option value="hour">Hour</option><option value="day" selected>Day</option><option value="week">Week</option><option value="month">Month</option><option value="year">Year</option><option value="all">All Time</option></select> <select id="analyticsPage"></select></div>
<div class="panel"><h2>Real Analytics</h2><canvas id="analyticsGraph" width="1000" height="120"></canvas><div id="siteMetrics" class="row"></div><h3>Traffic Per Page</h3><ul id="pageAnalytics"></ul></div>
<div class="panel"><h2>Product Manager</h2><div id="productGrid"></div></div>
<div class="panel"><h2>Page Manager</h2><div id="pageManager"></div><h3>Create Page</h3><form id="pageForm" class="row"><input id="pageName" placeholder="Page filename (example: vintage.html)" required><input id="pageLabel" placeholder="Nav label" required><select id="pageType"><option>Standard Page</option><option>Redirect Page</option></select><input id="redirectUrl" placeholder="Redirect URL (for Redirect Page)"><button>Create/Update Page</button></form></div>
</main></div>
<footer>
    <div class="footer-links">
        <div class="footer-line extra-padding"><a href="shop.html">Shop</a><a href="all.html">All</a><a href="new.html">New</a><a href="t-shirts.html">T-Shirts</a><a href="babynot.html">BabyNot</a></div>
        <div class="footer-line"><a href="about.html">About</a><a href="contact.html">Contact</a><a href="mailinglist.html">Mailing List</a><a href="faq.html">FAQ</a><a href="stores.html">Stores</a></div>
        <div class="footer-line less-padding"><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a><a href="accessibility.html">Accessibility</a></div>
    </div>
</footer>
</div>
<script>
const DASH_SESSION_KEY='mbnt_dashboard_auth',productsKey='mbnt_admin_products',pagesKey='mbnt_admin_pages',analyticsKey='mbnt_analytics_events';
const ACCESS={username:'maybenot',passwordHash:'461a77919bf434e323be3c1d06796673a925a273dd02f5cb06b7f3a2c19c059f'};
const SITE_PAGES=['index.html','shop.html','all.html','new.html','t-shirts.html','babynot.html','vintage.html','hoodie.html','hats.html','accessories.html','shirts.html','sweatshirts.html','pants.html','bags.html','skate.html','cart.html','checkout.html','about.html','contact.html','mbnt-mickey-deez-shirt.html','mbnt-patagucci-shirt.html','mbnt-superior-shirt.html','mbnt-cancer-shirt.html','mbnt-pro-shops-shirt.html','mbnt-moon-landing-shirt.html','babynot-toddler-tee.html','babynot-hoodie-set.html','babynot-onesie.html'];
const PRODUCT_IMAGE_MAP={'BabyNot Toddler Tee':'babynotshirt.png','BabyNot Hoodie Set':'babynothoodiesetfront.png','BabyNot Onesie':'babynotonsie.png','MBNT MickyDz Shirt':'mbntmickeydeez.png','MBNT Patagucci Shirt':'mbntpatagucci.png','MBNT Superior Shirt':'mbntsuperior.png','MBNT Cancer Shirt':'MBNTCANCER.png','MBNT Pro Shops Shirt':'MBNTPROSHOPS.png','MBNT Moon Landing Shirt':'MBNTMOONLANDING.png','Camo Hat':'mbntsuperiorcamo.png','Blank Hoodie':'blankblackhoodie.png','Blank T-Shirt':'blankblackshirt.png','Backpack':'backpackblack.png','Skateboard 3':'skateboard3v2.png','Skateboard 2':'skateboard2.html','Skateboard 1':'skateboard1.png','Socks':'blacksocks.png','Trucker Hat':'truckerblackhat.png','Duffle Bag':'dufflebag1.png','American Denim Jeans':'bluejeans.png','Shorts':'blackshorts.png','Joggers':'blackjoggers.png','T-Shirt':'blackshirt.png','Hoodie':'blackhoodie.png','Hat -Baseball Cap':'blackhat.png'};
const read=(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d)),save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let dirty=false;
function getAllHtmlPages(){return ['index.html',...new Set(SITE_PAGES.concat((window.__files||[])))].filter(p=>p.endsWith('.html'))}
function trackEvent(type,payload={}){const e=read(analyticsKey,[]);e.push({type,timestamp:Date.now(),page:location.pathname.split('/').pop()||'index.html',...payload});save(analyticsKey,e)};trackEvent('page_visit',{page:'dashboard.html'});
function filterEvents(events,scope,page){const spans={hour:36e5,day:864e5,week:6048e5,month:26298e5,year:315576e5,all:1e16};const now=Date.now();return events.filter(e=>now-e.timestamp<=spans[scope]).filter(e=>!page||e.page===page)}
function drawGraph(events,scope){const c=document.getElementById('analyticsGraph'),x=c.getContext('2d'),bins=24,w=c.width,h=c.height,span={hour:36e5,day:864e5,week:6048e5,month:26298e5,year:315576e5,all:315576e5}[scope]||864e5,start=Date.now()-span,counts=Array(bins).fill(0);events.forEach(e=>{if(e.timestamp<start)return;counts[Math.min(bins-1,Math.floor((e.timestamp-start)/span*bins))]++});x.clearRect(0,0,w,h);const max=Math.max(...counts,1);x.strokeStyle='#000';x.beginPath();counts.forEach((v,i)=>{const px=i*(w/(bins-1)),py=h-10-((v/max)*(h-20));i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
function renderAll(){const scope=document.getElementById('filterRange').value,page=document.getElementById('analyticsPage').value,events=filterEvents(read(analyticsKey,[]),scope,page),pv=events.filter(e=>e.type==='page_visit');document.getElementById('siteMetrics').innerHTML=`<div>Visits: ${pv.length}</div><div>Unique sessions: ${new Set(events.map(e=>e.sessionId||e.timestamp)).size}</div>`;document.getElementById('pageAnalytics').innerHTML=Object.entries(pv.reduce((m,e)=>(m[e.page]=(m[e.page]||0)+1,m),{})).map(([p,c])=>`<li>${p}: ${c}</li>`).join('')||'<li>No tracked visits</li>';drawGraph(events,scope);renderProducts();renderPages()}
function ensureProductImages(products){return products.map(p=>{const images=(p.images||[]).filter(Boolean);if(images.length)return p;const mapped=PRODUCT_IMAGE_MAP[p.name];if(mapped)p.images=[mapped];return p})}
function renderProducts(){const products=ensureProductImages(read(productsKey,[]));save(productsKey,products);document.getElementById('productGrid').innerHTML=`<div class='grid-head'><div>Image</div><div>Name</div><div>Status</div><div>Sold Out</div><div>Actions</div></div>`+products.map((p,i)=>{const sold=(p.inventoryQuantity<1||p.manualSold);return `<div><div class='grid-row'><div>${p.images?.[0]?`<img class='product-img' src='${p.images[0]}' alt='${p.name}'>`:''}</div><div>${p.name}</div><div class='${p.status==='inactive'?'status-inactive':'status-active'}'>${p.status||'active'}</div><div class='${sold?'status-sold':''}'>${sold?'Sold Out':'In Stock'}</div><div><button onclick='toggleEdit(${i})'>Edit</button> <button onclick='deleteProduct(${i})'>Delete</button> <button onclick='toggleVisibility(${i})'>👁</button></div></div><div id='edit-${i}' class='edit-panel' hidden>${editPanel(p,i)}</div></div>`}).join('')}
function editPanel(p,i){const variants=(p.variantGroups||[{name:'Size',values:(p.variants||[])}]).map((g,gi)=>`<div class='variant-row'><input data-k='variantGroups.${gi}.name' value='${g.name||''}'><input data-k='variantGroups.${gi}.values' value='${(g.values||[]).join(', ')}'><button type='button' onclick='removeVariant(${i},${gi})'>Remove</button></div>`).join('');return `<div class='row'><input data-k='name' value='${p.name||''}'><textarea data-k='description'>${p.description||''}</textarea><input data-k='price' type='number' step='0.01' value='${p.price||0}'><input data-k='inventoryQuantity' type='number' value='${p.inventoryQuantity??0}'><input data-k='category' value='${p.category||''}'><input data-k='stripe_product_id' value='${p.stripe_product_id||''}'><input data-k='stripe_price_id' value='${p.stripe_price_id||''}'><input data-k='placement' value='${(p.placement||[]).join(', ')}'><input data-k='images' value='${(p.images||[]).join(', ')}'><label><input type='checkbox' data-k='manualSold' ${p.manualSold?'checked':''}> Manual sold out</label></div><h4>Variant Groups</h4><div>${variants}</div><button type='button' onclick='addVariant(${i})'>Add Variant Group</button> <button type='button' onclick='saveProduct(${i})'>Save</button> <button type='button' onclick='cancelEdit(${i})'>Cancel</button>`}
window.toggleEdit=i=>{document.getElementById(`edit-${i}`).hidden=!document.getElementById(`edit-${i}`).hidden}
window.cancelEdit=i=>{dirty=false;renderProducts()}
window.toggleVisibility=i=>{const p=read(productsKey,[]);p[i].status=p[i].status==='inactive'?'active':'inactive';save(productsKey,p);dirty=true;renderAll()}
window.deleteProduct=i=>{if(!confirm('Delete product?'))return;const p=read(productsKey,[]);p.splice(i,1);save(productsKey,p);renderAll()}
window.addVariant=i=>{const p=read(productsKey,[]);p[i].variantGroups=p[i].variantGroups||[];p[i].variantGroups.push({name:'Group',values:[]});save(productsKey,p);dirty=true;renderProducts();document.getElementById(`edit-${i}`).hidden=false}
window.removeVariant=(i,gi)=>{const p=read(productsKey,[]);(p[i].variantGroups||[]).splice(gi,1);save(productsKey,p);dirty=true;renderProducts();document.getElementById(`edit-${i}`).hidden=false}
window.saveProduct=i=>{if(!confirm('Confirm changes before saving?'))return;const products=read(productsKey,[]),panel=document.getElementById(`edit-${i}`);panel.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;if(k.startsWith('variantGroups.')){const [_,idx,f]=k.split('.');products[i].variantGroups=products[i].variantGroups||[];products[i].variantGroups[idx]=products[i].variantGroups[idx]||{};products[i].variantGroups[idx][f]=f==='values'?el.value.split(',').map(s=>s.trim()).filter(Boolean):el.value}else if(el.type==='checkbox')products[i][k]=el.checked;else if(['price','inventoryQuantity'].includes(k))products[i][k]=+el.value;else if(['placement','images'].includes(k))products[i][k]=el.value.split(',').map(s=>s.trim()).filter(Boolean);else products[i][k]=el.value});save(productsKey,products);dirty=false;renderAll()}
function renderPages(){const files=['index.html','shop.html','all.html','new.html','t-shirts.html','babynot.html','vintage.html','mbnt-mickey-deez-shirt.html','mbnt-patagucci-shirt.html','mbnt-superior-shirt.html','mbnt-cancer-shirt.html','mbnt-pro-shops-shirt.html','mbnt-moon-landing-shirt.html','babynot-toddler-tee.html','babynot-hoodie-set.html','babynot-onesie.html'];const custom=read(pagesKey,[]);const pages=[...new Set([...files,...custom.map(p=>p.slug)])];document.getElementById('pageManager').innerHTML=pages.map(slug=>{const c=custom.find(x=>x.slug===slug);return `<div>${slug} ${c?.type==='Redirect Page'?`→ ${c.redirectUrl||''}`:''}</div>`}).join('')}
document.getElementById('pageForm').addEventListener('submit',e=>{e.preventDefault();if(!confirm('Confirm changes before saving?'))return;const pages=read(pagesKey,[]),slug=document.getElementById('pageName').value.trim(),label=document.getElementById('pageLabel').value.trim(),type=document.getElementById('pageType').value,redirectUrl=document.getElementById('redirectUrl').value.trim();const ex=pages.find(p=>p.slug===slug);const data={slug,label,type,redirectUrl};if(ex)Object.assign(ex,data);else pages.push(data);save(pagesKey,pages);dirty=false;renderAll()})
function guardedRender(fn){return ()=>{if(dirty&&!confirm('Please confirm changes before changing pages if not done so already.')){return;}fn();}}
function initPageSelect(){const pages=[...new Set(['index.html',...SITE_PAGES,...read(pagesKey,[]).map(p=>p.slug)])];document.getElementById('analyticsPage').innerHTML=pages.map(p=>`<option ${p==='index.html'?'selected':''}>${p}</option>`).join('')}
document.getElementById('filterRange').addEventListener('change',guardedRender(renderAll));document.getElementById('analyticsPage').addEventListener('change',guardedRender(renderAll));
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(document.getElementById('password').value));const h=[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('');if(document.getElementById('username').value.trim()===ACCESS.username&&h===ACCESS.passwordHash){sessionStorage.setItem(DASH_SESSION_KEY,'1');document.getElementById('auth').hidden=true;document.getElementById('dashboard').hidden=false;renderAll()}else document.getElementById('authError').textContent='Invalid credentials.'});document.getElementById('logoutBtn').onclick=()=>{sessionStorage.removeItem(DASH_SESSION_KEY);document.getElementById('auth').hidden=false;document.getElementById('dashboard').hidden=true};
initPageSelect();if(sessionStorage.getItem(DASH_SESSION_KEY)==='1'){document.getElementById('auth').hidden=true;document.getElementById('dashboard').hidden=false;renderAll()}
setInterval(()=>document.getElementById('current-time').textContent=`${new Date().toLocaleTimeString('en-US',{timeZone:'America/Chicago'})} CHICAGO`,1000);
</script></body></html>

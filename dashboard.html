<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Team Private Admin</title><style>
html,body{min-height:100%}body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#000}.dashboard-shell{min-height:100vh;display:flex;flex-direction:column}.site-shell{max-width:1100px;margin:0 auto;padding:12px;flex:1;display:flex;flex-direction:column}.logo-container iframe{width:100%;height:120px;border:0}.time{font-size:12px;text-align:center;margin:6px 0 12px}.panel{border:1px solid #000;padding:12px;margin:10px 0}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}button{background:#000;color:#fff;border:1px solid #000;padding:8px;cursor:pointer}button:hover{border-color:#c00;color:#c00;background:#fff}input,textarea,select{width:100%;border:1px solid #000;padding:7px}h1,h2{margin:4px 0 10px}ul{padding-left:18px}small.err{color:#c00}main{flex:1}.chip-wrap{display:flex;gap:8px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;border:1px solid #000;padding:6px 10px;cursor:pointer}.chip input{display:none}.chip:has(input:checked){background:#000;color:#fff;border-color:#c00}.grid-head,.grid-row{display:grid;grid-template-columns:1.1fr .5fr 1fr 1fr .7fr .5fr .6fr .8fr;gap:8px;align-items:center}.grid-head{font-weight:700;border-bottom:1px solid #000;padding-bottom:6px}.grid-row{padding:8px 0;border-bottom:1px solid #ddd;font-size:13px}.status-active{color:#090}.status-sold{color:#c00}.status-inactive{color:#666}.analytics-empty{padding:14px;border:1px dashed #000;text-align:center}.footer{border-top:1px solid #000;padding:16px 12px;margin-top:16px}.footer-inner{max-width:1100px;margin:0 auto;text-align:center}
</style></head><body>
<div class="dashboard-shell"><div class="site-shell"><div class="logo-container"><iframe src="https://www.vectary.com/viewer/v1/?model=8b9281ad-097b-4408-88e2-ef824efa63eb&env=studio3&turntable=1"></iframe></div><div id="current-time" class="time"></div>
<section id="auth" class="panel"><form id="loginForm"><h1>Team Private Admin</h1><input id="username" placeholder="Username" required/><input id="password" type="password" placeholder="Password" required/><button>Login</button><small id="authError" class="err"></small></form></section>
<main id="dashboard" hidden>
<div class="panel"><button id="logoutBtn">Logout</button> <select id="filterRange"><option value="hour">Hour</option><option value="day" selected>Day</option><option value="week">Week</option><option value="month">Month</option><option value="year">Year</option><option value="all">All Time</option></select> <select id="analyticsPage"></select></div>
<div class="panel"><h2>Real Analytics</h2><canvas id="analyticsGraph" height="120"></canvas><div id="graphEmpty" class="analytics-empty" hidden>No tracked data yet.</div><div id="siteMetrics" class="row"></div><h3>Traffic Per Page</h3><ul id="pageAnalytics"></ul><h3>Traffic Per Product</h3><ul id="behaviorStats"></ul><ul id="cartStats"></ul></div>
<div class="panel"><h2>Product Manager</h2><div id="productGrid"></div></div>
<div class="panel"><h2>Create Product</h2><form id="productForm" class="row"><input id="pName" placeholder="Name" required/><textarea id="pDesc" placeholder="Description" required></textarea><input id="pPrice" type="number" step="0.01" placeholder="Price" required/><input id="pType" placeholder="Category" required/><input id="pColors" placeholder="variants csv"/><input id="pQty" type="number" placeholder="Inventory" required/><input id="pImage" placeholder="Image URL"/><div style="grid-column:1/-1"><b>Placement</b><div id="placementChips" class="chip-wrap"></div></div><button id="createProductBtn">Create Product</button><small id="productError" class="err"></small></form></div>
</main></div><footer class="footer"><div class="footer-inner"><a href="/">Home</a></div></footer></div>
<script>
const DASH_SESSION_KEY='mbnt_dashboard_auth',productsKey='mbnt_admin_products',pagesKey='mbnt_admin_pages',analyticsKey='mbnt_analytics_events';
const ACCESS={username:'maybenot',passwordHash:'461a77919bf434e323be3c1d06796673a925a273dd02f5cb06b7f3a2c19c059f'};
const SITE_PAGES=['index.html','shop.html','all.html','new.html','t-shirts.html','babynot.html','hoodie.html','hats.html','accessories.html','shirts.html','sweatshirts.html','pants.html','bags.html','skate.html','cart.html','checkout.html','about.html','contact.html','mbnt-mickey-deez-shirt.html','mbnt-patagucci-shirt.html','mbnt-superior-shirt.html','mbnt-cancer-shirt.html','mbnt-pro-shops-shirt.html','mbnt-moon-landing-shirt.html','babynot-toddler-tee.html','babynot-hoodie-set.html','babynot-onesie.html'];
const DEFAULT_PRODUCTS=[
['BabyNot Toddler Tee',34,'Babynot','prod_URI73EerQk7HzN','price_1TSPXE6vAbsTB4QVBNxWea2Q'],['BabyNot Hoodie Set',68,'Babynot','prod_URI6cjy7ITer9R','price_1TSPVv6vAbsTB4QV4OfgJtgs'],['BabyNot Onesie',38,'Babynot','prod_URI5Pm0Sqrmgrc','price_1TSPUu6vAbsTB4QVip8obNix'],['MBNT MickyDz Shirt',33,'T-Shirts','prod_URI4h0RwFN20t9','price_1TSPU46vAbsTB4QVSo6mSQco'],['MBNT Patagucci Shirt',33,'T-Shirts','prod_URI2kBsfMPpQxN','price_1TSPSa6vAbsTB4QVawXzIVV1'],['MBNT Superior Shirt',33,'T-Shirts','prod_URI1CMTD7YdMsT','price_1TSPRf6vAbsTB4QVVJgcmtbC'],['MBNT Cancer Shirt',33,'T-Shirts','prod_UQzDCF1M9g2UVy','price_1TS7FD6vAbsTB4QVESOzZ0uu'],['MBNT Pro Shops Shirt',33,'T-Shirts','prod_UQzCwwNPSHbisK','price_1TS7EX6vAbsTB4QV2bjSjwHv'],['MBNT Moon Landing Shirt',33,'T-Shirts','prod_UQzCPBRQCZpXcL','price_1TS7Dd6vAbsTB4QVIUD5Udk4'],['Camo Hat',50,'Hats','prod_UPpOShHXV381sE','price_1TQzjz6vAbsTB4QVWyt4CNNh'],['Blank Hoodie',60,'Hoodies','prod_UPpN0MCSfF0N65','price_1TQzjB6vAbsTB4QV5y30tIN3'],['Blank T-Shirt',30,'T-Shirts','prod_UPpM17opmPoYL1','price_1TQzi06vAbsTB4QVO9peR055'],['Backpack',60,'Accessories','prod_ULdc23Gc9PFyNB','price_1TMwLe6vAbsTB4QVyFZu293b'],['Skateboard 3',100,'Accessories','prod_ULZKFDB1JLnGh6','price_1TMsBv6vAbsTB4QVwwDsrvmn'],['Skateboard 2',100,'Accessories','prod_ULZJ0rwalf8tUv','price_1TMsB66vAbsTB4QVgdK0paRD'],['Skateboard 1',100,'Accessories','prod_ULZIuBGWVruf11','price_1TMsAJ6vAbsTB4QVof4P9O6J'],['Socks',20,'Accessories','prod_ULZIAZFUp8OgWN','price_1TMs9R6vAbsTB4QVRn8SawXZ'],['Trucker Hat',50,'Hats','prod_ULZE2oIKM8D87g','price_1TMs6P6vAbsTB4QVIB0j7b7k'],['Duffle Bag',80,'Accessories','prod_ULZCMf9IW4um9t','price_1TMs4N6vAbsTB4QV2N9UmUs1'],['American Denim Jeans',90,'Vintage','prod_ULZB4Kdw28SDkn','price_1TMs366vAbsTB4QVlEHmGj1A'],['Shorts',50,'Vintage','prod_ULZ8bv7MiCwWN7','price_1TMs0e6vAbsTB4QV0IU5JIPS'],['Joggers',70,'Vintage','prod_ULZ63zoxbfoLXS','price_1TMryV6vAbsTB4QVd9G1WVH1'],['T-Shirt',30,'T-Shirts','prod_ULZ5mZnzbDoW95','price_1TMrxb6vAbsTB4QVVI8wB6tb'],['Hoodie',70,'Hoodies','prod_ULZ54BRec9FNHD','price_1TMrwq6vAbsTB4QVGhANJDBO'],['Hat -Baseball Cap',40,'Hats','prod_ULZ4TI8qHdyovZ','price_1TMrw26vAbsTB4QVfnxBgAmB']
].map(p=>({name:p[0],price:p[1],category:p[2],stripe_product_id:p[3],stripe_price_id:p[4],inventoryQuantity:10,status:'active',placement:['All']}));
const $=id=>document.getElementById(id),read=(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d)),save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function seedProducts(){const current=read(productsKey,[]);const merged=[...current];for(const dp of DEFAULT_PRODUCTS){if(!merged.some(p=>p.stripe_product_id===dp.stripe_product_id))merged.push(dp);}save(productsKey,merged)}
function trackEvent(type,payload={}){const e=read(analyticsKey,[]);e.push({type,timestamp:Date.now(),page:location.pathname.split('/').pop()||'index.html',...payload});save(analyticsKey,e)};trackEvent('page_visit',{page:'dashboard.html'});
function filterEvents(events,scope,page){const filtered=scope==='all'?events:events.filter(e=>Date.now()-e.timestamp<={hour:36e5,day:864e5,week:6048e5,month:26298e5,year:315576e5}[scope]);return filtered.filter(e=>!page||e.page===page)}
function drawGraph(events,scope){const canvas=$('analyticsGraph'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);if(!events.length){$('graphEmpty').hidden=false;canvas.hidden=true;return}else{$('graphEmpty').hidden=true;canvas.hidden=false}const bins=24,now=Date.now(),span={hour:36e5,day:864e5,week:6048e5,month:26298e5,year:315576e5,all:315576e5}[scope]||864e5,start=now-span,counts=Array(bins).fill(0);events.forEach(e=>{if(e.timestamp<start)return;const idx=Math.min(bins-1,Math.floor((e.timestamp-start)/span*bins));counts[idx]++});const max=Math.max(...counts,1),w=canvas.width,h=canvas.height;ctx.strokeStyle='#000';ctx.beginPath();counts.forEach((c,i)=>{const x=i*(w/(bins-1)),y=h-((c/max)*(h-20))-10;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#c00';counts.forEach((c,i)=>{const x=i*(w/(bins-1)),y=h-((c/max)*(h-20))-10;ctx.fillRect(x-1,y-1,3,3)})}
function renderAll(){const scope=$('filterRange').value,page=$('analyticsPage').value,all=read(analyticsKey,[]),events=filterEvents(all,scope,page),by=t=>events.filter(e=>e.type===t).length,pv=events.filter(e=>e.type==='page_visit');$('siteMetrics').innerHTML=`<div>Visits: ${pv.length}</div><div>Unique sessions: ${new Set(events.map(e=>e.sessionId||e.timestamp)).size}</div><div>Cart visits: ${by('cart_visit')}</div><div>Checkout clicks: ${by('checkout_click')}</div><div>Add to cart: ${by('add_to_cart')}</div><div>Product views: ${by('product_page_visit')}</div>`;$('pageAnalytics').innerHTML=Object.entries(pv.reduce((m,e)=>(m[e.page]=(m[e.page]||0)+1,m),{})).map(([p,c])=>`<li>${p}: ${c}</li>`).join('')||'<li>No tracked visits</li>';$('cartStats').innerHTML=`<li>Products added to cart: ${by('add_to_cart')}</li>`;const pe=events.filter(e=>e.product).reduce((m,e)=>(m[e.product]=(m[e.product]||0)+1,m),{});$('behaviorStats').innerHTML=Object.entries(pe).map(([n,c])=>`<li>${n}: ${c}</li>`).join('')||'<li>No product events</li>';drawGraph(events,scope);renderProducts()}
function renderProducts(){const products=read(productsKey,[]);$('productGrid').innerHTML=`<div class='grid-head'><div>Name</div><div>Price</div><div>Stripe Product</div><div>Stripe Price</div><div>Category</div><div>Qty</div><div>Status</div><div>Actions</div></div>`+products.map((p,i)=>`<div class='grid-row'><div>${p.name}<br><small>${(p.placement||[]).join(', ')}</small></div><div>$${(+p.price).toFixed(2)}</div><div>${p.stripe_product_id}</div><div>${p.stripe_price_id}</div><div>${p.category||''}</div><div>${p.inventoryQuantity??0}</div><div class='${p.inventoryQuantity<1||p.manualSold?'status-sold':(p.status==='inactive'?'status-inactive':'status-active')}'>${p.inventoryQuantity<1||p.manualSold?'sold out':p.status||'active'}</div><div><button onclick='toggleActive(${i})'>Edit</button> <button onclick='deleteProduct(${i})'>Delete</button></div></div>`).join('')}
window.toggleActive=i=>{const p=read(productsKey,[]);p[i].status=p[i].status==='active'?'inactive':'active';save(productsKey,p);renderAll()};window.deleteProduct=i=>{const p=read(productsKey,[]);p.splice(i,1);save(productsKey,p);renderAll()};
function renderPlacementChips(){const opt=[...new Set(['New','All','T-Shirts','Babynot','Vintage','Hoodies','Hats','Accessories',...SITE_PAGES])];$('placementChips').innerHTML=opt.map(v=>`<label class='chip'><input type='checkbox' value='${v}' ${v==='All'?'checked':''}/> ${v}</label>`).join('')}
function selectedPlacements(){return [...document.querySelectorAll('#placementChips input:checked')].map(x=>x.value)}
$('productForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('createProductBtn');b.disabled=true;const placement=selectedPlacements();const product={name:$('pName').value.trim(),description:$('pDesc').value.trim(),price:+$('pPrice').value,category:$('pType').value.trim(),variants:$('pColors').value.split(',').map(s=>s.trim()).filter(Boolean),inventoryQuantity:+$('pQty').value,status:'active',images:[$('pImage').value.trim()].filter(Boolean),placement};try{const existing=read(productsKey,[]);if(existing.some(x=>x.name.toLowerCase()===product.name.toLowerCase()))throw new Error('Duplicate product name.');const r=await fetch('/api/products/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(product)});const d=await r.json();if(!r.ok)throw new Error(d.error||'failed');existing.push({...product,stripe_product_id:d.stripe_product_id,stripe_price_id:d.stripe_price_id,manualSold:product.inventoryQuantity<1});save(productsKey,existing);trackEvent('product_created',{product:product.name,page:'dashboard.html'});e.target.reset();renderPlacementChips();renderAll()}catch(err){$('productError').textContent=err.message}finally{b.disabled=false}});
function initPageSelect(){const pages=[...new Set(['index.html',...SITE_PAGES,...read(pagesKey,[]).map(p=>p.slug)])];$('analyticsPage').innerHTML=pages.map(p=>`<option ${p==='index.html'?'selected':''}>${p}</option>`).join('')}
$('filterRange').addEventListener('change',renderAll);$('analyticsPage').addEventListener('change',renderAll);
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode($('password').value));const h=[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('');if($('username').value.trim()===ACCESS.username&&h===ACCESS.passwordHash){sessionStorage.setItem(DASH_SESSION_KEY,'1');$('auth').hidden=true;$('dashboard').hidden=false;renderAll()}else $('authError').textContent='Invalid credentials.'});$('logoutBtn').onclick=()=>{sessionStorage.removeItem(DASH_SESSION_KEY);$('auth').hidden=false;$('dashboard').hidden=true};
seedProducts();renderPlacementChips();initPageSelect();if(sessionStorage.getItem(DASH_SESSION_KEY)==='1'){$('auth').hidden=true;$('dashboard').hidden=false;renderAll()}
setInterval(()=>$('current-time').textContent=`${new Date().toLocaleTimeString('en-US',{timeZone:'America/Chicago'})} CHICAGO`,1000);
</script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Team Private Admin</title></head><body>
<div class="site-shell"><div class="logo-container"><iframe src="https://www.vectary.com/viewer/v1/?model=8b9281ad-097b-4408-88e2-ef824efa63eb&env=studio3&turntable=1"></iframe></div><div id="current-time"></div>
<section id="auth"><form id="loginForm"><h1>Team Private Admin</h1><input id="username" required/><input id="password" type="password" required/><button>Login</button><p id="authError"></p></form></section>
<main id="dashboard" hidden><button id="logoutBtn">Logout</button>
<select id="filterRange"><option value="hour">Hour</option><option value="day">Day</option><option value="week">Week</option><option value="month">Month</option><option value="year">Year</option><option value="all" selected>All Time</option></select>
<div id="siteMetrics"></div><ul id="pageAnalytics"></ul>
<form id="productForm"><input id="pName" required/><textarea id="pDesc" required></textarea><input id="pPrice" type="number" required/><input id="pType" required/><input id="pColors"/><input id="pQty" type="number" required/><input id="pImage" type="file"/><input id="pVariantImages" type="file" multiple/><select id="pActive"><option value="active">Active</option><option value="inactive">Inactive</option></select><select id="pManualSold"><option value="false">No</option><option value="true">Yes</option></select><button id="createProductBtn">Create Product</button><p id="productError"></p></form>
<button id="newPageBtn" type="button">+</button><form id="pageForm" hidden><input id="pageName" required/><select id="pageType"><option>Product Page</option><option>Collection Page</option><option>About page</option><option>Blank page</option><option>Category page</option></select><button>Save Page Draft</button></form><ul id="pageList"></ul>
<div id="productGrid"></div><ul id="cartStats"></ul><ul id="behaviorStats"></ul></main>
<footer><a href="/">Home</a></footer></div>
<script>
const DASH_SESSION_KEY="mbnt_dashboard_auth",productsKey="mbnt_admin_products",pagesKey="mbnt_admin_pages",analyticsKey="mbnt_analytics_events";
const ACCESS={username:"maybenot",passwordHash:"461a77919bf434e323be3c1d06796673a925a273dd02f5cb06b7f3a2c19c059f"};
const SITE_PAGES=["index.html","shop.html","cart.html","checkout.html","about.html","contact.html","all.html","shirts.html","hats.html","pants.html","bags.html","sweatshirts.html","t-shirts.html","accessories.html","skate.html","babynot.html","dashboard.html"];
const $=id=>document.getElementById(id);const read=(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d));const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const hashText=async v=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)))].map(b=>b.toString(16).padStart(2,"0")).join("");
function trackEvent(type,payload={}){const e=read(analyticsKey,[]);e.push({type,timestamp:Date.now(),page:location.pathname.split('/').pop()||'index.html',...payload});save(analyticsKey,e)}
trackEvent('page_visit',{page:'dashboard.html'});
function filterEvents(events,scope){if(scope==='all')return events;const ms={hour:36e5,day:864e5,week:6048e5,month:26298e5,year:315576e5}[scope];return events.filter(e=>Date.now()-e.timestamp<=ms)}
function renderAll(scope='all'){const events=filterEvents(read(analyticsKey,[]),scope),by=t=>events.filter(e=>e.type===t).length,pv=events.filter(e=>e.type==='page_visit'),cart=read('cart',[]);$('siteMetrics').textContent=`traffic:${pv.length} cart:${by('cart_visit')} checkout:${by('checkout_click')} add:${by('add_to_cart')} qty:${cart.reduce((a,b)=>a+(+b.quantity||1),0)}`;$('pageAnalytics').innerHTML=Object.entries(pv.reduce((m,e)=>(m[e.page]=(m[e.page]||0)+1,m),{})).map(([p,c])=>`<li>${p} — ${c}</li>`).join('')||'<li>No tracked visits</li>';$('cartStats').innerHTML=`<li>Cart visits: ${by('cart_visit')}</li><li>Checkout clicks: ${by('checkout_click')}</li>`;const pe=events.filter(e=>e.product).reduce((m,e)=>(m[e.product]=(m[e.product]||0)+1,m),{});$('behaviorStats').innerHTML=Object.entries(pe).map(([n,c])=>`<li>${n}: ${c}</li>`).join('')||'<li>No product events</li>';const products=read(productsKey,[]);$('productGrid').innerHTML=products.map((p,i)=>`<div><b>${p.name}</b> $${(+p.price).toFixed(2)} PriceID:${p.stripe_price_id||'n/a'} <button onclick="toggleActive(${i})">Toggle</button><button onclick="markSoldOut(${i})">SoldOut</button></div>`).join('');renderPages();}
window.toggleActive=i=>{const p=read(productsKey,[]);p[i].status=p[i].status==='active'?'inactive':'active';save(productsKey,p);renderAll($('filterRange').value)};window.markSoldOut=i=>{const p=read(productsKey,[]);p[i].manualSold=true;save(productsKey,p);renderAll($('filterRange').value)};
$('filterRange').addEventListener('change',e=>renderAll(e.target.value));
$('productForm').addEventListener('submit',async e=>{e.preventDefault();$('createProductBtn').disabled=true;$('productError').textContent='';const qty=+$('pQty').value;const product={name:$('pName').value.trim(),description:$('pDesc').value.trim(),price:+$('pPrice').value,category:$('pType').value.trim(),variants:$('pColors').value.split(',').map(s=>s.trim()).filter(Boolean),inventoryQuantity:qty,status:$('pActive').value,manualSold:$('pManualSold').value==='true',images:[$('pImage').files[0]?.name].filter(Boolean)};try{const r=await fetch('/api/products/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(product)});const d=await r.json();if(!r.ok)throw new Error(d.error||'failed');const list=read(productsKey,[]);list.push({...product,qty,stripe_product_id:d.stripe_product_id,stripe_price_id:d.stripe_price_id});save(productsKey,list);trackEvent('product_created',{product:product.name});e.target.reset();renderAll($('filterRange').value);}catch(err){$('productError').textContent=err.message}finally{$('createProductBtn').disabled=false}});
const templates={"Product Page":"<h1>Product</h1>","Collection Page":"<h1>Collection</h1>","About page":"<h1>About</h1>","Blank page":"","Category page":"<h1>Category</h1>"};
$('newPageBtn').onclick=()=>$('pageForm').hidden=!$('pageForm').hidden;function pages(){const s=read(pagesKey,[]),base=SITE_PAGES.map(slug=>({slug,type:'Existing Page',content:''}));return [...new Map([...base,...s].map(p=>[p.slug,p])).values()]};function savePages(p){save(pagesKey,p.filter(x=>x.type!=='Existing Page'||!SITE_PAGES.includes(x.slug)))}
function renderPages(){$('pageList').innerHTML=pages().map((p,i)=>`<li>${p.slug} (${p.type}) <button onclick="editPage(${i})">Edit</button> <button onclick="deletePage(${i})">Delete</button></li>`).join('')}
window.editPage=i=>{const ps=pages();const c=prompt('Edit content',ps[i].content||'');if(c===null)return;ps[i].content=c;savePages(ps);renderPages()};window.deletePage=i=>{const ps=pages();if(!confirm(`Delete ${ps[i].slug}?`))return;ps.splice(i,1);savePages(ps);renderPages()};
$('pageForm').addEventListener('submit',e=>{e.preventDefault();const ps=pages();ps.push({slug:$('pageName').value.trim().toLowerCase().replace(/\s+/g,'-')+'.html',type:$('pageType').value,content:templates[$('pageType').value]||''});savePages(ps);e.target.reset();$('pageForm').hidden=true;renderPages()});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();if($('username').value.trim()===ACCESS.username&&await hashText($('password').value)===ACCESS.passwordHash){sessionStorage.setItem(DASH_SESSION_KEY,'1');$('auth').hidden=true;$('dashboard').hidden=false;renderAll($('filterRange').value)}else $('authError').textContent='Invalid credentials.'});$('logoutBtn').onclick=()=>{sessionStorage.removeItem(DASH_SESSION_KEY);$('auth').hidden=false;$('dashboard').hidden=true};
if(sessionStorage.getItem(DASH_SESSION_KEY)==='1'){$('auth').hidden=true;$('dashboard').hidden=false;renderAll()}
setInterval(()=>$('current-time').textContent=`${new Date().toLocaleTimeString('en-US',{timeZone:'America/Chicago'})} CHICAGO`,1000);
</script></body></html>
